name: Java 21 validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: namespace-profile-puneet-chandna
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Build and verify the packaged artifact
        run: ./mvnw -B clean verify
      - name: Check Python runner and independent validators
        env:
          # setup-java adds -ntp; verified-build tests require explicit Maven args.
          MAVEN_ARGS: ''
        run: |
          python3 -m pip install -r scripts/requirements-tui.txt
          python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Retain and independently validate four-case smoke
        shell: bash
        run: |
          java -Xmx4g -jar target/lattora-*.jar --profile smoke --output-dir target/ci-smoke
          runs=(target/ci-smoke/*)
          test "${#runs[@]}" -eq 1
          python3 scripts/statistics_validator.py "${runs[0]}"
          python3 -c 'import hashlib,json,pathlib; jar=next(pathlib.Path("target").glob("lattora-*.jar")); run=next(pathlib.Path("target/ci-smoke").iterdir()); assert json.loads((run/"run.json").read_text())["artifact_sha256"]==hashlib.sha256(jar.read_bytes()).hexdigest()'

  macos-validation:
    # macos-15 is Apple Silicon; Intel macOS is outside the supported scope.
    runs-on: macos-15
    timeout-minutes: 20
    env:
      JAVA_HOME: ''
      MAVEN_ARGS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install the project-local Apple Silicon JDK and terminal UI
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          ./lattora.sh --setup
          # Reclaim setup's disk cache on the 7 GB runner; retain the real
          # application's 3 GiB minimum and every subsequent memory check.
          sudo /usr/sbin/purge
          ./lattora.sh --check --plain --output-dir .cloudsim/ci/check
          ./run-research.sh --check --plain
      - name: Verify the packaged artifact, native probes and terminal workflows
        shell: bash
        run: |
          sudo /usr/sbin/purge
          ./lattora.sh --test --plain --output-dir .cloudsim/ci/test
      - name: Run and independently validate every frozen profile
        shell: bash
        run: |
          sudo /usr/sbin/purge
          for profile in smoke explore research; do
            ./lattora.sh --profile "$profile" --workers 1 --plain --output-dir ".cloudsim/ci/$profile"
          done
      - name: Run bounded static stress with native RSS monitoring
        shell: bash
        run: |
          ./lattora.sh --profile stress --vms 100 --hosts 20 --population 10 --iterations 4 --replications 1 --workers 2 --time-limit 5m --plain --output-dir .cloudsim/ci/stress
          .cloudsim/venv/bin/python -B - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(next(Path('.cloudsim/ci/stress').glob('stress-*/runner.json')).read_text())
          assert metadata['status'] == 'complete' and metadata['validation'] == 'PASS'
          assert metadata['production']['sampled_peak_rss_bytes'] > 0
          PY

      - name: Run and independently validate a configured static scenario
        shell: bash
        run: |
          ./lattora.sh --profile scenario --preset known-answer-tight --workers 1 --plain --output-dir .cloudsim/ci/scenario
          ./lattora.sh validate .cloudsim/ci/scenario/scenario-* --plain --output-dir .cloudsim/ci/scenario-validation
          .cloudsim/venv/bin/python -B - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(next(Path('.cloudsim/ci/scenario').glob('scenario-*/runner.json')).read_text())
          assert metadata['status'] == 'complete' and metadata['validation'] == 'PASS'
          report = json.loads(next(Path('.cloudsim/ci/scenario-validation').glob('validate-*/runner.json')).read_text())
          assert report['validation'] == 'PASS' and report['exit_code'] == 0
          PY

  release-smoke:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [namespace-profile-puneet-chandna, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      # This job promises packaged smoke only. Linux PR validation runs the oracle suite.
      - name: Build and validate packaged smoke
        shell: pwsh
        run: |
          if ($IsWindows) { .\mvnw.cmd -B '-Dmaven.test.skip=true' clean package }
          else { ./mvnw -B '-Dmaven.test.skip=true' clean package }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $jar = @(Get-ChildItem target/lattora-*.jar)
          if ($jar.Count -ne 1) { throw 'Expected one packaged engine' }
          java -Xmx4g -jar $jar[0].FullName --profile smoke --output-dir target/ci-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runs = @(Get-ChildItem -Directory target/ci-smoke)
          if ($runs.Count -ne 1) { throw 'Expected one smoke run' }
          python scripts/statistics_validator.py $runs[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Get-Content (Join-Path $runs[0].FullName 'run.json') -Raw | ConvertFrom-Json
          $artifactHash = (Get-FileHash $jar[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.artifact_sha256 -ne $artifactHash) { throw 'Artifact hash mismatch' }
